[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noette"
version = "0.1.0"
description = "Recurrent Latent Ponder-Loop Architecture for Small Language Models (SLMs)"
readme = "README.md"
authors = [{ name = "Noette Team" }]
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0.0",
]

[project.urls]
"Homepage" = "https://github.com/Muse-Research/Noette"
